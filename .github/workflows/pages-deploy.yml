name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: Nizam

      - name: Build app
        run: npm run build
        working-directory: Nizam

      - name: Prepare Pages artifact
        run: |
          mkdir -p output
          cp -a Nizam/dist/Nizam/browser/. output/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
