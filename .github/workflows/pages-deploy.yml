name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Nizam/package-lock.json

      - name: Install dependencies
        working-directory: Nizam
        run: npm ci

      - name: Build application
        working-directory: Nizam
        run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p dist-output
          cp -r Nizam/dist/Nizam/browser/* dist-output/
          echo 'ammacollectivewear.com' > dist-output/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-output
          cname: ammacollectivewear.com
