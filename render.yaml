services:
  - type: web
    name: nizam-ai
    runtime: node
    region: oregon  # or frankfurt, singapore, etc.
    plan: free  # or starter, standard, etc.
    workingDirectory: ./Nizam
    buildCommand: npm install && npm run build
    startCommand: node dist/Nizam/server/server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Server-side rendering. The CSR fallback is the escape hatch if the
      # engine is ever disabled; leave unset to serve the built client only.
      - key: ENABLE_SSR
        value: "true"
      - key: META_VERIFY_TOKEN
        sync: false  # Set in Render dashboard (WhatsApp webhook handshake)
      - key: META_APP_SECRET
        sync: false  # Set in Render dashboard (X-Hub-Signature-256 verification)
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard (required, server exits without it)
      - key: SES_REGION
        sync: false  # Set in Render dashboard
      - key: SES_VERIFIED_SENDER
        sync: false  # Set in Render dashboard
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Set in Render dashboard (required for SES email)
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Set in Render dashboard (required for SES email)
      - key: RAZORPAY_KEY_ID
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_TEST_KEY_ID
        sync: false
      - key: RAZORPAY_TEST_KEY_SECRET
        sync: false
      - key: APP_URL
        value: "https://nizam-ai.onrender.com"  # Update with your actual URL
      - key: CORS_ORIGIN
        value: "https://ammawears.com"  # Frontend origin allowed to call this API
      - key: environment
        value: "production"
    healthCheckPath: /health
    autoDeploy: true