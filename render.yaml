services:
  - type: web
    name: nizam-ai
    runtime: node
    region: oregon  # or frankfurt, singapore, etc.
    plan: free  # or starter, standard, etc.
    workingDirectory: ./Nizam
    # `npm ci --include=dev` is required, not optional.
    #
    # This service sets NODE_ENV=production, and Render exports a service's
    # envVars during the BUILD as well as at runtime. npm treats
    # NODE_ENV=production as `--omit=dev`, so a plain `npm install`/`npm ci`
    # installed 178 packages instead of 681 and the build died immediately:
    #
    #   Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'sharp'
    #   imported from .../scripts/optimize-images.mjs
    #
    # followed by `sh: 1: ng: not found`, because `sharp`, `@angular/cli`,
    # `@angular/build` and `typescript` are all devDependencies and the build
    # genuinely needs them. `--include=dev` overrides the omit implied by
    # NODE_ENV. The runtime image still only ever loads `dependencies`.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/Nizam/server/server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is deliberately NOT set here. Render assigns a free port at runtime
      # and exports it as PORT; pinning it to 4000 here risks the app listening
      # on a port the proxy does not forward to. `src/server.ts` reads PORT and
      # falls back to 4000 for local runs.
      # Server-side rendering. The CSR fallback is the escape hatch if the
      # engine is ever disabled; leave unset to serve the built client only.
      - key: ENABLE_SSR
        value: "true"
      - key: META_VERIFY_TOKEN
        sync: false  # Set in Render dashboard (WhatsApp webhook handshake)
      - key: META_APP_SECRET
        sync: false  # Set in Render dashboard (X-Hub-Signature-256 verification)
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard (required, server exits without it)
      - key: SES_REGION
        sync: false  # Set in Render dashboard
      - key: SES_VERIFIED_SENDER
        sync: false  # Set in Render dashboard
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Set in Render dashboard (required for SES email)
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Set in Render dashboard (required for SES email)
      - key: RAZORPAY_KEY_ID
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_TEST_KEY_ID
        sync: false
      - key: RAZORPAY_TEST_KEY_SECRET
        sync: false
      - key: APP_URL
        # Must match a hostname that is actually served. The SSR engine rejects
        # any Host header that is not on its allowlist, so a stale value here
        # (this used to say `nizam-ai.onrender.com` while the service is
        # `nizam-ai-zpwn.onrender.com`) makes every page request 400.
        value: "https://ammawears.com"
      - key: API_URL
        value: "https://api.ammawears.com"  # Public API origin the browser calls
      - key: CORS_ORIGIN
        value: "https://ammawears.com, https://www.ammawears.com"  # Frontend origins allowed to call this API
      - key: environment
        value: "production"
    healthCheckPath: /health
    autoDeploy: true