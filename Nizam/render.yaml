services:
  - type: web
    name: nizam-ai
    runtime: node
    region: oregon  # or frankfurt, singapore, etc.
    plan: free  # or starter, standard, etc.
    workingDirectory: .
    # `npm ci --include=dev` is required, not optional. This service sets
    # NODE_ENV=production, and Render exports a service's envVars during the
    # BUILD as well as at runtime. npm reads NODE_ENV=production as
    # `--omit=dev`, so a plain `npm install` skipped every devDependency and the
    # build failed with `Cannot find package 'sharp'` and then `ng: not found`
    # (sharp, @angular/cli, @angular/build and typescript are all devDeps that
    # the build genuinely needs). `--include=dev` overrides that omit.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/Nizam/server/server.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is deliberately NOT set here. Render assigns a free port at runtime
      # and exports it as PORT; pinning it here risks the app listening on a
      # port the proxy does not forward to. `src/server.ts` reads PORT and falls
      # back to 4000 for local runs.
      - key: MONGODB_URI
        sync: false  # Set in Render dashboard; never commit a real URI here
      - key: ENABLE_SSR
        value: "true"
      - key: META_VERIFY_TOKEN
        sync: false  # Set in Render dashboard (WhatsApp webhook handshake)
      - key: META_APP_SECRET
        sync: false  # Set in Render dashboard (X-Hub-Signature-256 verification)
      - key: SES_REGION
        sync: false  # Set in Render dashboard
      - key: SES_VERIFIED_SENDER
        sync: false  # Set in Render dashboard
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Set in Render dashboard
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Set in Render dashboard
      - key: QIKINK_API_KEY
        sync: false  # Set in Render dashboard
      - key: PRINTFUL_API_KEY
        sync: false  # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false  # Free-tier Google AI Studio key for the customer assistant
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_TEST_KEY_ID
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_TEST_KEY_SECRET
        sync: false  # Set in Render dashboard
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false  # Set in Render dashboard
      - key: ORDER_NOTIFICATION_EMAIL
        sync: false  # Set in Render dashboard; defaults to ammacollectivewear@gmail.com in code when unset
      - key: JWT_SECRET
        sync: false  # Set in Render dashboard (required, server exits without it)
      - key: APP_URL
        # Must match a hostname that is actually served. The SSR engine rejects
        # any Host header that is not on its allowlist, so a stale value here
        # makes every page request 400.
        value: "https://ammawears.com"
      - key: API_URL
        value: "https://api.ammawears.com"  # Public API origin the browser calls
      - key: CORS_ORIGIN
        value: "https://ammawears.com, https://www.ammawears.com"  # Frontend origins allowed to call this API
      - key: environment
        value: "production"
    healthCheckPath: /health
    autoDeploy: true