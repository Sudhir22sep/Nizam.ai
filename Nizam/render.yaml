    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
                  - key: MONGODB_URI
        value: "mongodb+srv://sudhir22sep_db_user:Sudhir0501@amma-wear.vgvwvpo.mongodb.net/ammawears_prod?retryWrites=true&w=majority"
