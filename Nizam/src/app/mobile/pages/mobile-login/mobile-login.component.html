<div class="app-page auth">
  <header class="app-header">
    <h1 class="app-header__title">Sign in</h1>
  </header>

  <div class="app-body">
    <p class="auth__intro">Welcome back. Sign in to see your orders and saved items.</p>

    <form class="auth__form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Email</span>
        <span class="field__control">
          <ion-icon name="mail-outline" class="field__icon" aria-hidden="true"></ion-icon>
          <input
            type="email"
            class="field__input"
            placeholder="you@example.com"
            autocomplete="email"
            inputmode="email"
            enterkeyhint="next"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
          />
        </span>
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <span class="field__control">
          <ion-icon name="lock-closed-outline" class="field__icon" aria-hidden="true"></ion-icon>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="field__input"
            placeholder="Your password"
            autocomplete="current-password"
            enterkeyhint="go"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
          />
          <button
            type="button"
            class="field__toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            <ion-icon [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </span>
      </label>

      <button type="submit" class="auth__submit" [disabled]="submitting()">
        @if (submitting()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="auth__switch">
      New to Amma Wears?
      <a routerLink="/register">Create an account</a>
    </p>

    <p class="auth__switch">
      <a routerLink="/products">Continue shopping</a> without signing in
    </p>
  </div>
</div>
