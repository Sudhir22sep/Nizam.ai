<div class="products-container">
  <header class="page-header">
    <span class="eyebrow">The collection</span>
    <h1>Shop the Collection</h1>
    <p class="page-subtitle">Premium apparel and curated essentials, crafted for style, comfort, and confidence.</p>
  </header>

  <div class="filters" role="group" aria-label="Filter products by category">
    <button
      class="filter-btn"
      [class.active]="selectedCategory === ''"
      (click)="resetFilter()">
      All
    </button>
    <button
      *ngFor="let category of categories()"
      class="filter-btn"
      [class.active]="selectedCategory === category"
      (click)="filterByCategory(category)">
      {{ category }}
    </button>
  </div>

  <div class="products-grid">
    <div *ngFor="let product of filteredProducts(); trackBy: trackByProductId" class="product-card">
      <div class="product-media">
        <a [routerLink]="[product.id]" class="product-image" [attr.aria-label]="'View ' + product.name">
          <img [src]="primaryImage(product)" [alt]="product.name" appImageFallback loading="lazy">
        </a>
        <span class="product-overlay">
          <button type="button" class="btn-quick-add" (click)="addToCart(product)">
            <span aria-hidden="true">+</span> Quick add
          </button>
          <button type="button" class="overlay-heart" (click)="addToWishlist(product)" aria-label="Add to wishlist">♥</button>
        </span>
      </div>
      <div class="product-info">
        <p class="category">{{ product.category }}</p>
        <h3>{{ product.name }}</h3>
        <p class="description">{{ product.description }}</p>
        <div class="product-footer">
          <span class="price">{{ product.basePrice | price }}</span>
          <button class="btn-wishlist" (click)="addToWishlist(product)" aria-label="Add to wishlist">♥</button>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="filteredProducts().length === 0" class="no-products-wrapper">
    <app-empty-state
      variant="no-products"
      title="No products found"
      body="Try adjusting your filters or browse a different category."
      actionLabel="Reset filters"
      [actionCallback]="resetFilter"
    ></app-empty-state>
  </div>
</div>
