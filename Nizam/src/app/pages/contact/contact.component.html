<div class="contact-page">
  <h1>Contact us</h1>
  <p>Have a styling question or need help with your order? Send us a message and we’ll reply within one business day.</p>

  <form (ngSubmit)="submitContact()">
    <label>
      Name
      <input type="text" [(ngModel)]="name" name="name" required />
    </label>

    <label>
      Email
      <input type="email" [(ngModel)]="email" name="email" required />
    </label>

    <label>
      Message
      <textarea [(ngModel)]="message" name="message" rows="5" required></textarea>
    </label>

    <button type="submit" [disabled]="isSubmitting">Send message</button>
    <p class="status">{{ status }}</p>
  </form>

  <div class="contact-details">
    <h2>Need faster support?</h2>
    <p>Email us directly at <a href="mailto:sudhir.22sep@gmail.com">sudhir.22sep@gmail.com</a>.</p>
    <p>For dropshipping, wholesale, or partner inquiries, please contact <a href="mailto:sudhir.22sep@gmail.com">sudhir.22sep@gmail.com</a>.</p>
  </div>
</div>
