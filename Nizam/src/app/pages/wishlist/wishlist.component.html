<div class="wishlist-container">
  <div class="wishlist-header">
    <h2>My Wishlists</h2>
    <button class="btn btn-primary" (click)="openCreateWishlistModal()">
      + Create New Wishlist
    </button>
  </div>

  <app-glass-popup
    [isOpen]="showCreateModal"
    eyebrow="Your style profile"
    title="Create a new wishlist"
    description="Keep saved pieces organised for edits, occasions, or a personal style shortlist."
    (closed)="closeCreateWishlistModal()">
    <form class="wishlist-form" [formGroup]="createWishlistForm" (ngSubmit)="onCreateWishlistSubmit()">
      <div class="form-group">
        <label for="wishlistName">Wishlist name</label>
        <input type="text" id="wishlistName" formControlName="name" placeholder="e.g. Weekend edit"
               [class.is-invalid]="createWishlistForm.get('name')?.invalid && createWishlistForm.get('name')?.touched">
        <div class="invalid-feedback" *ngIf="createWishlistForm.get('name')?.invalid && createWishlistForm.get('name')?.touched">
          Wishlist name is required
        </div>
      </div>

      <label class="checkbox-label">
        <input type="checkbox" formControlName="isPublic">
        Make this wishlist public
      </label>

      <div class="wishlist-form__actions">
        <button type="submit" class="wishlist-form__primary" [disabled]="createWishlistForm.invalid || isCreating">
          {{ isCreating ? 'Creating…' : 'Create wishlist' }}
        </button>
        <button type="button" class="wishlist-form__secondary" (click)="closeCreateWishlistModal()">Cancel</button>
      </div>
    </form>
  </app-glass-popup>

  <!-- Wishlists List -->
  <div class="wishlists-grid">
    <div *ngIf="wishlists.length === 0 && !isLoading" class="empty-state-wrapper">
      <app-empty-state
        variant="wishlist"
        title="No wishlists yet"
        body="Create your first wishlist and save your favorite styles."
        actionLabel="Create Your First Wishlist"
        [actionCallback]="onCreateFirstWishlist"
      ></app-empty-state>
    </div>
    <div *ngIf="isLoading" class="loading-indicator">
      <div class="spinner"></div>
      <p>Loading wishlists...</p>
    </div>
    <div *ngIf="wishlists.length > 0 && !isLoading">
      <div *ngFor="let wishlist of wishlists" class="wishlist-card">
         <div class="wishlist-header">
           <h3>{{ wishlist.name }}</h3>
           <div class="wishlist-meta">
             <span *ngIf="wishlist.isPublic" class="badge badge-public">Public</span>
             <span class="wishlist-count">{{ wishlist.items?.length || 0 }} items</span>
           </div>
         </div>

         <div class="wishlist-items" *ngIf="wishlist.items && wishlist.items.length > 0">
           <div class="wishlist-item" *ngFor="let item of wishlist.items; let i = index">
             <img *ngIf="item.productImage" [src]="item.productImage" [alt]="item.productName || 'Product image'" class="item-image" loading="lazy" />
             <div class="item-info">
               <h4>
                 <a [routerLink]="['/product', item.productId]">{{ item.productName || 'Product #' + (i + 1) }}</a>
               </h4>
               <p *ngIf="item.productPrice !== null && item.productPrice !== undefined" class="item-price">
                 {{ item.productCurrency === 'INR' ? '₹' : '$' }}{{ item.productPrice | number: '1.2-2' }}
               </p>
               <p *ngIf="item.notes" class="item-notes">{{ item.notes }}</p>
             </div>
             <div class="item-actions">
               <button class="btn btn-outline btn-sm" (click)="removeItemFromWishlist(wishlist._id, item.productId, item.variantId?.toString())">
                 Remove
               </button>
             </div>
           </div>
         </div>

         <div class="wishlist-items empty" *ngIf="!wishlist.items || wishlist.items.length === 0">
            <app-empty-state
              variant="wishlist"
              title="This wishlist is empty"
              body="Start adding items you love."
            ></app-empty-state>
          </div>

         <div class="wishlist-actions">
           <button class="btn btn-outline" (click)="viewWishlistItems(wishlist._id)">
             View Items
           </button>
           <button class="btn btn-danger" (click)="deleteWishlist(wishlist._id)">
             Delete Wishlist
           </button>
         </div>
       </div>
     </div>
  </div>
  <app-bento-highlights
    eyebrow="Your style profile"
    title="Keep discovering pieces you love"
  />
</div>
