<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <a routerLink="/" class="logo">nizam.ai</a>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="isMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-menu" [class.active]="isMenuOpen">
      <li>
        <a 
          routerLink="/" 
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()">
          Home
        </a>
      </li>
      <li>
        <a 
          routerLink="/products" 
          routerLinkActive="active"
          (click)="closeMenu()">
          Shop
        </a>
      </li>
      <li>
        <a 
          routerLink="/cart"
          routerLinkActive="active"
          (click)="closeMenu()">
          Cart
        </a>
      </li>
      <li>
        <a 
          routerLink="/checkout"
          routerLinkActive="active"
          (click)="closeMenu()">
          Checkout
        </a>
      </li>
      <li>
        <a href="#about" (click)="closeMenu()">
          About
        </a>
      </li>
      <li>
        <a 
          routerLink="/contact"
          routerLinkActive="active"
          (click)="closeMenu()">
          Contact
        </a>
      </li>
    </ul>

    <div class="navbar-icons">
      <a href="#search" class="icon-btn">🔍</a>
      <a routerLink="/cart" class="icon-btn">
        🛒 <span class="cart-count">{{ cartService.getItemCount() }}</span>
      </a>
      <select class="currency-select" [value]="currentCurrency" (change)="changeCurrency($any($event.target).value)">
        <option value="INR">INR</option>
        <option value="USD">USD</option>
        <option value="AED">AED</option>
        <option value="SAR">SAR</option>
      </select>
      <a href="#account" class="icon-btn">👤</a>
    </div>
  </div>
</nav>
